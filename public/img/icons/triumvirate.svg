<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <style>
      .s { stroke: var(--icon-stroke); stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .f { fill: var(--icon-fill); }
      .a { fill: var(--icon-accent); opacity: 0.95; }
      .c { fill: rgba(255,255,255,0.16); }
    </style>
  </defs>

  <!-- Double ring -->
  <circle class="s" cx="50" cy="50" r="42"/>
  <circle class="s" cx="50" cy="50" r="36" opacity="0.85"/>

  <!-- Canal (center spine) -->
  <rect x="48" y="26" width="4" height="56" rx="2" class="c"/>
  <path class="s" d="M50 26V82"/>

  <!-- Steps / terraces -->
  <path class="f" d="M22 70H78V82H22z"/>
  <path class="f" d="M28 60H72V68H28z"/>
  <path class="f" d="M33 52H67V58H33z"/>
  <path class="f" d="M37 45H63V50H37z"/>
  <path class="f" d="M41 38H59V42H41z"/>

  <!-- Pillars (three teal bars) -->
  <rect x="41" y="20" width="6" height="16" class="a" rx="1"/>
  <rect x="47" y="14" width="6" height="22" class="a" rx="1"/>
  <rect x="53" y="20" width="6" height="16" class="a" rx="1"/>
</svg>
