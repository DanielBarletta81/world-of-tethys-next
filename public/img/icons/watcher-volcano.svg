<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <radialGradient id="edgeGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="var(--coin-edge-1)"/><stop offset="55%" stop-color="#3b3b3b"/><stop offset="100%" stop-color="var(--coin-edge-2)"/>
    </radialGradient>
    <radialGradient id="faceGrad" cx="35%" cy="30%" r="90%">
      <stop offset="0%" stop-color="var(--coin-face-1)"/><stop offset="60%" stop-color="#262626"/><stop offset="100%" stop-color="var(--coin-face-2)"/>
    </radialGradient>
    <radialGradient id="spec" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/><stop offset="60%" stop-color="rgba(255,255,255,0.05)"/><stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.05" result="b"/>
      <feOffset dx="-1" dy="-1" result="hl"/>
      <feOffset dx="1" dy="1" result="sh"/>
      <feMerge><feMergeNode in="hl"/><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .edge{fill:url(#edgeGrad)} .face{fill:url(#faceGrad)} .spec{fill:url(#spec);mix-blend-mode:screen;opacity:.9}
      .fill{fill:var(--stamp-fill)}
      .hi{stroke:var(--stamp-hi);stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .sh{stroke:var(--stamp-sh);stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .ember{fill:var(--ember)}
    </style>
  </defs>

  <circle cx="50" cy="50" r="44" class="edge"/>
  <circle cx="50" cy="50" r="38" class="face"/>
  <circle cx="50" cy="50" r="38" class="spec"/>

  <g filter="url(#emboss)">
    <!-- Ember glow around vent -->
    <circle cx="50" cy="48" r="16" class="ember"/>

    <!-- Volcano cone (fill) -->
    <path class="fill" d="M30 70 L50 36 L70 70 Z"/>
    <!-- Lava fissure -->
    <path class="fill" d="M49 44 L52 52 L48 60 L51 66" />

    <!-- Ash plume -->
    <path class="fill" d="M43 30 C40 26,44 24,48 24 C46 22,49 20,52 21 C52 18,56 19,57 22 C60 22,62 25,60 27 C63 28,62 32,58 32 C57 35,51 35,49 33 C47 35,43 34,43 30 Z"/>

    <!-- shadow stroke -->
    <g transform="translate(0.8,0.8)">
      <path class="sh" d="M30 70 L50 36 L70 70 Z"/>
      <path class="sh" d="M49 44 L52 52 L48 60 L51 66"/>
      <path class="sh" d="M43 30 C40 26,44 24,48 24 C46 22,49 20,52 21 C52 18,56 19,57 22 C60 22,62 25,60 27 C63 28,62 32,58 32 C57 35,51 35,49 33 C47 35,43 34,43 30 Z"/>
    </g>

    <!-- highlight stroke -->
    <path class="hi" d="M30 70 L50 36 L70 70 Z"/>
    <path class="hi" d="M49 44 L52 52 L48 60 L51 66"/>
    <path class="hi" d="M43 30 C40 26,44 24,48 24 C46 22,49 20,52 21 C52 18,56 19,57 22 C60 22,62 25,60 27 C63 28,62 32,58 32 C57 35,51 35,49 33 C47 35,43 34,43 30 Z"/>
  </g>
</svg>
