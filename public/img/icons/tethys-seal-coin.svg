<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="edgeGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="var(--coin-edge-1)"/>
      <stop offset="55%" stop-color="#3b3b3b"/>
      <stop offset="100%" stop-color="var(--coin-edge-2)"/>
    </radialGradient>
    <radialGradient id="faceGrad" cx="35%" cy="30%" r="90%">
      <stop offset="0%" stop-color="var(--coin-face-1)"/>
      <stop offset="60%" stop-color="#2b2b2b"/>
      <stop offset="100%" stop-color="var(--coin-face-2)"/>
    </radialGradient>
    <radialGradient id="spec" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.20)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.0)"/>
    </radialGradient>

    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.0" result="b"/>
      <feOffset dx="-1" dy="-1" result="hl"/>
      <feOffset dx="1" dy="1" result="sh"/>
      <feMerge>
        <feMergeNode in="hl"/>
        <feMergeNode in="sh"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .edge{ fill:url(#edgeGrad); }
      .face{ fill:url(#faceGrad); }
      .spec{ fill:url(#spec); mix-blend-mode:screen; opacity:.9; }
      .hi{ stroke: var(--stamp-1); stroke-width: 2.8; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .sh{ stroke: var(--stamp-2); stroke-width: 2.8; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .fill{ fill: var(--stamp-fill); }
    </style>
  </defs>

  <circle cx="50" cy="50" r="44" class="edge"/>
  <circle cx="50" cy="50" r="38" class="face"/>
  <circle cx="50" cy="50" r="38" class="spec"/>

  <g filter="url(#emboss)">
    <!-- fill under-stamp -->
    <path class="fill" d="M42 58 L50 36 L58 58 Z"/>

    <!-- shadow pass -->
    <g transform="translate(0.8,0.8)">
      <circle class="sh" cx="28" cy="40" r="5"/>
      <path class="sh" d="M42 58 L50 36 L58 58 Z"/>
      <path class="sh" d="M74 34 C69 35,66 39,66 44 C66 49,69 53,74 54 C71 51,70 48,70 44 C70 40,71 37,74 34Z"/>
      <path class="sh" d="M28 64 C32 60,36 60,40 64 C44 68,48 68,52 64 C56 60,60 60,64 64 C68 68,72 68,76 64"/>
      <path class="sh" d="M32 72 C40 70,60 70,68 72"/>
    </g>

    <!-- highlight pass -->
    <circle class="hi" cx="28" cy="40" r="5"/>
    <path class="hi" d="M42 58 L50 36 L58 58 Z"/>
    <path class="hi" d="M74 34 C69 35,66 39,66 44 C66 49,69 53,74 54 C71 51,70 48,70 44 C70 40,71 37,74 34Z"/>
    <path class="hi" d="M28 64 C32 60,36 60,40 64 C44 68,48 68,52 64 C56 60,60 60,64 64 C68 68,72 68,76 64"/>
    <path class="hi" d="M32 72 C40 70,60 70,68 72"/>

    <!-- sun rays (minimal) -->
    <path class="hi" d="M28 30V33 M28 47V50 M18 40H21 M35 40H38"/>
  </g>
</svg>
