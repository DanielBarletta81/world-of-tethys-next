<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <radialGradient id="edgeGrad" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="var(--coin-edge-1)"/><stop offset="55%" stop-color="#3b3b3b"/><stop offset="100%" stop-color="var(--coin-edge-2)"/></radialGradient>
    <radialGradient id="faceGrad" cx="35%" cy="30%" r="90%"><stop offset="0%" stop-color="var(--coin-face-1)"/><stop offset="60%" stop-color="#262626"/><stop offset="100%" stop-color="var(--coin-face-2)"/></radialGradient>
    <radialGradient id="spec" cx="30%" cy="25%" r="55%"><stop offset="0%" stop-color="rgba(255,255,255,0.18)"/><stop offset="60%" stop-color="rgba(255,255,255,0.05)"/><stop offset="100%" stop-color="rgba(255,255,255,0)"/></radialGradient>
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="1.05" result="b"/><feOffset dx="-1" dy="-1" result="hl"/><feOffset dx="1" dy="1" result="sh"/><feMerge><feMergeNode in="hl"/><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    <style>
      .edge{fill:url(#edgeGrad)} .face{fill:url(#faceGrad)} .spec{fill:url(#spec);mix-blend-mode:screen;opacity:.9}
      .fill{fill:var(--stamp-fill)}
      .hi{stroke:var(--stamp-hi);stroke-width:2.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .sh{stroke:var(--stamp-sh);stroke-width:2.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .teal{fill:var(--teal)}
    </style>
  </defs>

  <circle cx="50" cy="50" r="44" class="edge"/>
  <circle cx="50" cy="50" r="38" class="face"/>
  <circle cx="50" cy="50" r="38" class="spec"/>

  <g filter="url(#emboss)">
    <circle cx="62" cy="60" r="18" class="teal"/>

    <!-- cliff mass -->
    <path class="fill" d="M26 78 L26 34 C26 30,30 28,34 30 L66 42 C70 44,74 48,74 52 L74 78 Z"/>

    <!-- domes / terraces (minimal) -->
    <path class="fill" d="M34 54 C38 50,44 50,48 54 C44 57,38 57,34 54 Z"/>
    <path class="fill" d="M50 48 C54 44,60 44,64 48 C60 51,54 51,50 48 Z"/>

    <!-- waterfall cut -->
    <path class="fill" d="M66 52 C68 60,68 68,66 78 L60 78 C62 68,62 60,60 52 Z"/>

    <!-- fracture seam (Cambria mode) -->
    <path class="fill" d="M42 34 L46 44 L40 50 L48 58 L44 66 L52 74"/>

    <g transform="translate(0.8,0.8)">
      <path class="sh" d="M26 78 L26 34 C26 30,30 28,34 30 L66 42 C70 44,74 48,74 52 L74 78 Z"/>
      <path class="sh" d="M66 52 C68 60,68 68,66 78 L60 78 C62 68,62 60,60 52 Z"/>
      <path class="sh" d="M42 34 L46 44 L40 50 L48 58 L44 66 L52 74"/>
    </g>

    <path class="hi" d="M26 78 L26 34 C26 30,30 28,34 30 L66 42 C70 44,74 48,74 52 L74 78 Z"/>
    <path class="hi" d="M34 54 C38 50,44 50,48 54 C44 57,38 57,34 54 Z"/>
    <path class="hi" d="M50 48 C54 44,60 44,64 48 C60 51,54 51,50 48 Z"/>
    <path class="hi" d="M66 52 C68 60,68 68,66 78 L60 78 C62 68,62 60,60 52 Z"/>
    <path class="hi" d="M42 34 L46 44 L40 50 L48 58 L44 66 L52 74"/>
  </g>
</svg>
