<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="edgeGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="var(--coin-edge-1)"/>
      <stop offset="55%" stop-color="#3b3b3b"/>
      <stop offset="100%" stop-color="var(--coin-edge-2)"/>
    </radialGradient>
    <radialGradient id="faceGrad" cx="35%" cy="30%" r="90%">
      <stop offset="0%" stop-color="var(--coin-face-1)"/>
      <stop offset="60%" stop-color="#2b2b2b"/>
      <stop offset="100%" stop-color="var(--coin-face-2)"/>
    </radialGradient>
    <radialGradient id="spec" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.20)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.0)"/>
    </radialGradient>

    <radialGradient id="mysticInlay" cx="45%" cy="55%" r="60%">
      <stop offset="0%" stop-color="rgba(140,210,198,0.22)"/>
      <stop offset="55%" stop-color="rgba(120,180,170,0.14)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>

    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="b"/>
      <feOffset dx="-1" dy="-1" result="hl"/>
      <feOffset dx="1" dy="1" result="sh"/>
      <feMerge>
        <feMergeNode in="hl"/>
        <feMergeNode in="sh"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .edge{ fill:url(#edgeGrad); }
      .face{ fill:url(#faceGrad); }
      .spec{ fill:url(#spec); mix-blend-mode:screen; opacity:.9; }
      .inlay{ fill:url(#mysticInlay); }
      .hi{ stroke: var(--stamp-1); stroke-width: 2.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .sh{ stroke: var(--stamp-2); stroke-width: 2.6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .fill{ fill: var(--stamp-fill); }
    </style>
  </defs>

  <circle cx="50" cy="50" r="44" class="edge"/>
  <circle cx="50" cy="50" r="38" class="face"/>
  <circle cx="50" cy="50" r="38" class="spec"/>
  <circle cx="50" cy="55" r="26" class="inlay"/>

  <g filter="url(#emboss)">
    <!-- Spiral (stamped) -->
    <path class="fill" d="M50 50 m0-16 a16 16 0 1 1 -0.1 0 m0.1 0 a12 12 0 1 0 0.1 0 m-0.1 0 a8 8 0 1 1 -0.1 0 m0.1 0 a4 4 0 1 0 0.1 0" />

    <!-- Root crown rays -->
    <g transform="translate(0.8,0.8)">
      <path class="sh" d="M50 22 C48 30,47 36,45 41"/>
      <path class="sh" d="M38 24 C40 31,42 36,44 42"/>
      <path class="sh" d="M62 24 C60 31,58 36,56 42"/>
      <path class="sh" d="M30 31 C36 35,40 38,44 43"/>
      <path class="sh" d="M70 31 C64 35,60 38,56 43"/>
      <path class="sh" d="M26 43 C33 45,39 46,44 46"/>
      <path class="sh" d="M74 43 C67 45,61 46,56 46"/>
    </g>

    <path class="hi" d="M50 22 C48 30,47 36,45 41"/>
    <path class="hi" d="M38 24 C40 31,42 36,44 42"/>
    <path class="hi" d="M62 24 C60 31,58 36,56 42"/>
    <path class="hi" d="M30 31 C36 35,40 38,44 43"/>
    <path class="hi" d="M70 31 C64 35,60 38,56 43"/>
    <path class="hi" d="M26 43 C33 45,39 46,44 46"/>
    <path class="hi" d="M74 43 C67 45,61 46,56 46"/>

    <!-- small bird stamp -->
    <g transform="translate(0.8,0.8)">
      <path class="sh" d="M50 74 C52 74,54 75,55 77 C56 79,54 80,52 80 C51 80,50 79,50 79 C50 79,49 80,48 80 C46 80,44 79,45 77 C46 75,48 74,50 74Z"/>
    </g>
    <path class="hi" d="M50 74 C52 74,54 75,55 77 C56 79,54 80,52 80 C51 80,50 79,50 79 C50 79,49 80,48 80 C46 80,44 79,45 77 C46 75,48 74,50 74Z"/>
  </g>
</svg>
