<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <radialGradient id="edgeGrad" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="var(--coin-edge-1)"/><stop offset="55%" stop-color="#3b3b3b"/><stop offset="100%" stop-color="var(--coin-edge-2)"/></radialGradient>
    <radialGradient id="faceGrad" cx="35%" cy="30%" r="90%"><stop offset="0%" stop-color="var(--coin-face-1)"/><stop offset="60%" stop-color="#262626"/><stop offset="100%" stop-color="var(--coin-face-2)"/></radialGradient>
    <radialGradient id="spec" cx="30%" cy="25%" r="55%"><stop offset="0%" stop-color="rgba(255,255,255,0.18)"/><stop offset="60%" stop-color="rgba(255,255,255,0.05)"/><stop offset="100%" stop-color="rgba(255,255,255,0)"/></radialGradient>

    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.05" result="b"/>
      <feOffset dx="-1" dy="-1" result="hl"/>
      <feOffset dx="1" dy="1" result="sh"/>
      <feMerge><feMergeNode in="hl"/><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .edge{fill:url(#edgeGrad)} .face{fill:url(#faceGrad)} .spec{fill:url(#spec);mix-blend-mode:screen;opacity:.9}
      .fill{fill:var(--stamp-fill)}
      .hi{stroke:var(--stamp-hi);stroke-width:2.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .sh{stroke:var(--stamp-sh);stroke-width:2.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .ember{fill:var(--ember)}
      .teal{fill:var(--teal)}
    </style>
  </defs>

  <circle cx="50" cy="50" r="44" class="edge"/>
  <circle cx="50" cy="50" r="38" class="face"/>
  <circle cx="50" cy="50" r="38" class="spec"/>

  <g filter="url(#emboss)">
    <!-- restrained coastal haze -->
    <ellipse cx="50" cy="58" rx="26" ry="18" class="teal"/>

    <!-- left landmass -->
    <path class="fill" d="M22 76 V34 C22 30,26 28,30 30 L44 36 C48 38,48 46,44 48 L34 54 C30 56,28 60,28 64 V76 Z"/>
    <!-- right landmass -->
    <path class="fill" d="M78 76 V34 C78 30,74 28,70 30 L56 36 C52 38,52 46,56 48 L66 54 C70 56,72 60,72 64 V76 Z"/>

    <!-- the strait channel -->
    <path class="fill" d="M46 28 C49 34,49 42,46 50 C44 56,44 62,46 72
                          L54 72 C56 62,56 56,54 50 C51 42,51 34,54 28 Z"/>

    <!-- volcanic seam (ember only around the narrows) -->
    <path class="ember" d="M49 34 L51 40 L49 46 L51 52 L49 58 L51 64" />

    <!-- strokes (shadow then highlight) -->
    <g transform="translate(0.8,0.8)">
      <path class="sh" d="M22 76 V34 C22 30,26 28,30 30 L44 36 C48 38,48 46,44 48 L34 54 C30 56,28 60,28 64 V76 Z"/>
      <path class="sh" d="M78 76 V34 C78 30,74 28,70 30 L56 36 C52 38,52 46,56 48 L66 54 C70 56,72 60,72 64 V76 Z"/>
      <path class="sh" d="M46 28 C49 34,49 42,46 50 C44 56,44 62,46 72 L54 72 C56 62,56 56,54 50 C51 42,51 34,54 28 Z"/>
      <path class="sh" d="M49 34 L51 40 L49 46 L51 52 L49 58 L51 64"/>
    </g>

    <path class="hi" d="M22 76 V34 C22 30,26 28,30 30 L44 36 C48 38,48 46,44 48 L34 54 C30 56,28 60,28 64 V76 Z"/>
    <path class="hi" d="M78 76 V34 C78 30,74 28,70 30 L56 36 C52 38,52 46,56 48 L66 54 C70 56,72 60,72 64 V76 Z"/>
    <path class="hi" d="M46 28 C49 34,49 42,46 50 C44 56,44 62,46 72 L54 72 C56 62,56 56,54 50 C51 42,51 34,54 28 Z"/>
    <path class="hi" d="M49 34 L51 40 L49 46 L51 52 L49 58 L51 64"/>
  </g>
</svg>
