<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <radialGradient id="edgeGrad" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="var(--coin-edge-1)"/><stop offset="55%" stop-color="#3b3b3b"/><stop offset="100%" stop-color="var(--coin-edge-2)"/></radialGradient>
    <radialGradient id="faceGrad" cx="35%" cy="30%" r="90%"><stop offset="0%" stop-color="var(--coin-face-1)"/><stop offset="60%" stop-color="#262626"/><stop offset="100%" stop-color="var(--coin-face-2)"/></radialGradient>
    <radialGradient id="spec" cx="30%" cy="25%" r="55%"><stop offset="0%" stop-color="rgba(255,255,255,0.18)"/><stop offset="60%" stop-color="rgba(255,255,255,0.05)"/><stop offset="100%" stop-color="rgba(255,255,255,0)"/></radialGradient>
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="1.0" result="b"/><feOffset dx="-1" dy="-1" result="hl"/><feOffset dx="1" dy="1" result="sh"/><feMerge><feMergeNode in="hl"/><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .edge{fill:url(#edgeGrad)} .face{fill:url(#faceGrad)} .spec{fill:url(#spec);mix-blend-mode:screen;opacity:.9}
      .fill{fill:var(--stamp-fill)}
      .hi{stroke:var(--stamp-hi);stroke-width:2.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .sh{stroke:var(--stamp-sh);stroke-width:2.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .teal{fill:var(--teal)}
    </style>
  </defs>

  <circle cx="50" cy="50" r="44" class="edge"/>
  <circle cx="50" cy="50" r="38" class="face"/>
  <circle cx="50" cy="50" r="38" class="spec"/>

  <g filter="url(#emboss)">
    <circle cx="50" cy="58" r="18" class="teal"/>

    <!-- Island needle / spire -->
    <path class="fill" d="M46 76 L50 30 L54 76 Z"/>

    <!-- Surf rings -->
    <path class="fill" d="M28 66 C36 60, 44 60, 50 63 C56 60, 64 60, 72 66"/>
    <path class="fill" d="M32 73 C40 68, 46 68, 50 70 C54 68, 60 68, 68 73"/>

    <!-- Wing mark (minimal fast courier) -->
    <path class="fill" d="M50 44 C58 42, 65 39, 70 34 C67 41, 61 46, 54 49"/>
    <path class="fill" d="M50 44 C42 42, 35 39, 30 34 C33 41, 39 46, 46 49"/>

    <g transform="translate(0.8,0.8)">
      <path class="sh" d="M46 76 L50 30 L54 76 Z"/>
      <path class="sh" d="M28 66 C36 60, 44 60, 50 63 C56 60, 64 60, 72 66"/>
      <path class="sh" d="M32 73 C40 68, 46 68, 50 70 C54 68, 60 68, 68 73"/>
      <path class="sh" d="M50 44 C58 42, 65 39, 70 34 C67 41, 61 46, 54 49"/>
      <path class="sh" d="M50 44 C42 42, 35 39, 30 34 C33 41, 39 46, 46 49"/>
    </g>

    <path class="hi" d="M46 76 L50 30 L54 76 Z"/>
    <path class="hi" d="M28 66 C36 60, 44 60, 50 63 C56 60, 64 60, 72 66"/>
    <path class="hi" d="M32 73 C40 68, 46 68, 50 70 C54 68, 60 68, 68 73"/>
    <path class="hi" d="M50 44 C58 42, 65 39, 70 34 C67 41, 61 46, 54 49"/>
    <path class="hi" d="M50 44 C42 42, 35 39, 30 34 C33 41, 39 46, 46 49"/>
  </g>
</svg>
