<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="Forged hybrid seal">
  <g fill="none" stroke="currentColor" stroke-linecap="round">
    <!-- Outer ring (attempted imperfection, but controlled) -->
    <circle cx="60" cy="60" r="52" stroke-width="5" stroke-dasharray="260 10" />
    <!-- Inner authority ring (added by City) -->
    <circle cx="60" cy="60" r="44" stroke-width="2" />
    <!-- Central vertical spine (retained) -->
    <path d="M60 30v60" stroke-width="4" />
    <!-- Curved mark (over-regularized) -->
    <path d="M72 36 C64 44, 64 76, 72 84" stroke-width="3" />
    <!-- Control nodes (City embellishment) -->
    <circle cx="60" cy="18" r="2" />
    <circle cx="60" cy="102" r="2" />
  </g>
</svg>
